# =====================================================================
#  Apache virtual host for the AIIMS IT Event Portal
#
#  Install on Ubuntu/Debian:
#    sudo cp deploy/aiims.apache.conf /etc/apache2/sites-available/aiims.conf
#    sudo a2enmod proxy proxy_http headers
#    sudo a2ensite aiims.conf
#    sudo apachectl configtest && sudo systemctl reload apache2
#
#  This vhost is identical whether the app runs in Docker or as a plain
#  systemd service, because both publish the app on 127.0.0.1:8080.
# =====================================================================

<VirtualHost *:80>
    ServerName it-ntp-server
    ServerAlias 172.16.98.235
    DocumentRoot /var/www/html

    # ---------- logs ----------
    ErrorLog  ${APACHE_LOG_DIR}/aiims-error.log
    CustomLog ${APACHE_LOG_DIR}/aiims-access.log combined

    # ---------- reverse proxy ----------
    ProxyPreserveHost On
    ProxyRequests     Off          # stream uploads straight through

    # Pass the real scheme so Spring Security can set the Secure cookie flag
    # and build correct redirects behind the proxy.
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # ---------- tuning ----------
    # The app accepts up to a 100 MB request (20 MB per file). Apache's default
    # ProxyTimeout of 60s will abort large image uploads, hence the long timeout.
    ProxyTimeout      300

    # 0 = unlimited body size (the app enforces its own 100MB / 20MB limits)
    LimitRequestBody  0

    <Directory /var/www/html>
        Options -Indexes
        Require all granted
    </Directory>

    # ---------- security headers ----------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Uncomment once HTTPS is configured via certbot:
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>