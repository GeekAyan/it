# ==============================================================
#  AIIMS Kalyani - IT Event Portal - Apache configuration
#
#  IMPORTANT: this is NOT a standalone <VirtualHost>.
#
#  This Apache host already serves several applications on port 80:
#      /network_monitor  /mrtg  /gestioip  /switch-live
#
#  Adding a separate <VirtualHost> with a ServerAlias for this server's
#  IP would claim EVERY request for that host and break all of the above.
#  Instead, add the block below INSIDE the existing virtual host
#  (/etc/apache2/sites-available/000-default.conf, just before
#  </VirtualHost>).
#
#  Install with:
#      # back up first
#      sudo cp -a /etc/apache2/sites-available/000-default.conf \
#              /etc/apache2/sites-available/000-default.conf.bak-$(date +%Y%m%d-%H%M%S)
#
#      # insert the block just before the closing </VirtualHost>
#      sudo awk '/<\/VirtualHost>/ && !d {
#                  while ((getline l < "/opt/aiims/deploy/event-proxy.conf") > 0) print l
#                  d=1
#              } { print }' \
#          /etc/apache2/sites-available/000-default.conf > /tmp/dd.conf
#      sudo install -m 644 /tmp/dd.conf /etc/apache2/sites-available/000-default.conf
#      sudo apachectl configtest && sudo systemctl reload apache2
#
#  The application runs with server.servlet.context-path=/event, so this
#  maps /event/  ->  http://127.0.0.1:8080/event/
#
#  Requires: a2enmod proxy proxy_http headers
# ==============================================================

    # Send a bare /event to /event/ (ProxyPass below only matches /event/).
    RedirectMatch 302 ^/event$ /event/

    # ProxyRequests and ProxyTimeout are server/vhost-level directives and
    # are NOT allowed inside <Location>, so they sit out here.
    ProxyRequests Off
    ProxyTimeout  300

    <Location /event/>
        Require all granted
        ProxyPreserveHost On

        RequestHeader set X-Forwarded-Proto "http"

        ProxyPass        http://127.0.0.1:8080/event/
        ProxyPassReverse http://127.0.0.1:8080/event/
    </Location>