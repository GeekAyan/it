# =====================================================================
#  Production overrides for the AIIMS IT Event Portal.
#  Installed as /opt/aiims/application-prod.properties and loaded via
#      --spring.config.additional-location=file:/opt/aiims/
#
#  These values OVERRIDE application.properties inside the jar, so they can
#  be changed by editing this file and restarting - no rebuild needed.
# =====================================================================

# Only reachable via the Apache reverse proxy; never directly on the network.
server.address=127.0.0.1
server.port=8080

# Mount the application under /event.
#
# This Apache host already serves /network_monitor, /mrtg, /gestioip and
# /switch-live on port 80, so the app cannot claim the whole virtual host.
# Running under the /event context path means every link the app generates
# (all templates use Thymeleaf @{/...}, which prepends the context path, and
# the success handler uses request.getContextPath()) stays under /event.
server.servlet.context-path=/event

# Trust X-Forwarded-Proto from Apache so Spring Security sets the Secure
# cookie flag and builds correct redirects behind the proxy.
server.forward-headers-strategy=framework

# --- database ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- views -------------------------------------------------------------
# The classpath default is cache=false, which is wrong for production.
spring.thymeleaf.cache=true

# --- uploads -----------------------------------------------------------
# Relative to the systemd WorkingDirectory=/opt/aiims.
file.upload-dir=uploads

# --- logging -----------------------------------------------------------
# The classpath defaults enable DEBUG for security and mail, which is very
# noisy and can log sensitive content. Quiet them down here.
logging.level.root=INFO
logging.level.com.aiimsk.it=INFO
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.mail.javamail=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Optional: write a rotating file log as well as stdout/journal.
# logging.file.name=/opt/aiims/logs/application.log
# logging.logback.rollingpolicy.max-file-size=20MB
# logging.logback.rollingpolicy.max-history=14