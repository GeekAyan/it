<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Event Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body class="app-body">

    <div class="topbar">
        <div class="topbar-left">
            <img th:src="@{/images/aiims-logo.png}" alt="AIIMS Logo" class="topbar-logo">
            <div>
                <h2 class="topbar-title">AIIMS Kalyani Event Submission Portal</h2>
                <p class="topbar-subtitle">Conference, workshop, seminar and institutional event details</p>
            </div>
        </div>

        <div class="topbar-right">
            <div class="user-badge" th:text="${loggedInUser}"></div>
            <a th:href="@{/}" class="btn btn-link">Submit Event</a>
            <a th:href="@{/events}" class="btn btn-link">My Events</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <div class="form-page">
        <div class="form-card">
            <div class="title left-align">
                <h2 th:text="${event.title}">Event title</h2>
                <p th:text="${event.eventType}">Event type</p>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label>Event Type</label>
                    <input type="text" th:value="${event.eventType}" readonly>
                </div>

                <div class="field">
                    <label>Event Date</label>
                    <input type="text" th:value="${event.eventDate}" readonly>
                </div>

                <div class="field">
                    <label>Organizing Department</label>
                    <input type="text" th:value="${event.organizer}" readonly>
                </div>

                <div class="field">
                    <label>Target Audience</label>
                    <input type="text" th:value="${event.venue}" readonly>
                </div>

                <div class="field">
                    <label>Contact Name</label>
                    <input type="text" th:value="${event.contactName}" readonly>
                </div>

                <div class="field">
                    <label>Contact Phone</label>
                    <input type="text" th:value="${event.contactPhone}" readonly>
                </div>

                <div class="field full-width">
                    <label>Description (Less than 70 words)</label>
                    <textarea rows="6" readonly th:text="${event.description}"></textarea>
                </div>

                <div class="field full-width">
                    <label>Google Drive Link</label>
                    <input type="text" th:value="${event.googleDriveLink != null ? event.googleDriveLink : 'Not provided'}" readonly>
                </div>

                <div class="field full-width">
                    <label>Uploaded Images</label>

                    <div th:if="${#lists.isEmpty(event.images)}">
                        No uploaded images.
                    </div>

                    <div th:if="${!#lists.isEmpty(event.images)}">
                        <div class="form-actions" style="margin-bottom:16px;">
                            <a class="btn" th:href="@{/events/{id}/download-all(id=${event.id})}">
                                Download All as ZIP
                            </a>
                        </div>

                        <div class="image-gallery">
                            <div class="image-gallery-item" th:each="img, stat : ${event.images}">
                                <a th:href="@{/files/download/{fileName}(fileName=${img.imagePath})}"
                                    title="Click to download">
                                    <img class="image-gallery-thumb"
                                        th:src="@{/files/view/{fileName}(fileName=${img.imagePath})}"
                                        th:alt="${img.imagePath}"
                                        loading="lazy">
                                </a>
                                <div class="image-gallery-info" th:text="${stat.count} + '. ' + ${img.imagePath}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions" style="margin-top:20px;">
                <a class="btn" th:href="@{/events}">Back to My Events</a>
            </div>
        </div>
    </div>

</body>

</html>
