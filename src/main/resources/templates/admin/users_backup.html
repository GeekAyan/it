<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Admins</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div class="app-shell">
        <header th:replace="~{admin/header :: adminHeader('users')}"></header>

        <main class="admin-main">
            <section class="page-card">
                <div class="page-head">
                    <div>
                        <h2>Manage Admins</h2>
                        <p>Add, edit, or remove admin users.</p>
                    </div>
                    <a class="primary-btn" th:href="@{/admin/users/new}">Add Admin</a>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}"></td>
                                <td th:text="${u.name != null && !u.name.isBlank() ? u.name : '—'}"></td>
                                <td th:text="${u.email}"></td>
                                <td><span class="badge" th:text="${u.role}"></span></td>
                                <td>
                                    <div class="actions">
                                        <a class="secondary-btn"
                                            th:href="@{/admin/users/edit/{id}(id=${u.id})}">Edit</a>
                                        <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post"
                                            style="margin:0;" onsubmit="return confirm('Delete this admin user?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="danger-btn">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="5">No users found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
