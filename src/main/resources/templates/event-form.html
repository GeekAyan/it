<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>AIIMS Kalyani Event Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body class="app-body">

    <div class="topbar">
        <div class="topbar-left">
            <img th:src="@{/images/aiims-logo.png}" alt="AIIMS Logo" class="topbar-logo">
            <div>
                <h2 class="topbar-title">AIIMS Kalyani Event Submission Portal</h2>
                <p class="topbar-subtitle">Conference, workshop, seminar and institutional event details</p>
            </div>
        </div>

        <div class="topbar-right">
            <div class="user-badge" th:text="${loggedInUser}"></div>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <div class="form-page">
        <div class="form-card">
            <div class="title left-align">
                <h2>Submit Event Details</h2>
                <p>Fill in the event details and upload up to 5 images. Total upload limit is 100 MB.</p>
            </div>

            <p class="success-msg" th:if="${message}" th:text="${message}"></p>
            <p class="error-msg" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/save}" method="post" enctype="multipart/form-data" th:object="${event}">
                <div class="form-grid">
                    <div class="field">
                        <label>Event Type</label>
                        <select th:field="*{eventType}" required>
                            <option value="">Select Type</option>
                            <option value="Conference">Conference</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Seminar">Seminar</option>
                            <option value="Training">Training</option>
                            <option value="Meeting">Meeting</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Event Date</label>
                        <input type="date" th:field="*{eventDate}" required>
                    </div>

                    <div class="field full-width">
                        <label>Title</label>
                        <input type="text" th:field="*{title}" required>
                    </div>

                    <div class="field">
                        <label>Organizer</label>
                        <input type="text" th:field="*{organizer}" required>
                    </div>

                    <div class="field">
                        <label>Venue</label>
                        <input type="text" th:field="*{venue}" required>
                    </div>

                    <div class="field full-width">
                        <label>Description</label>
                        <textarea th:field="*{description}" rows="5" required></textarea>
                    </div>

                    <div class="field">
                        <label>Contact Name</label>
                        <input type="text" th:field="*{contactName}" required>
                    </div>

                    <div class="field">
                        <label>Contact Phone</label>
                        <input type="text" th:field="*{contactPhone}" pattern="^\+?\d{10,15}$" title="Enter a valid phone number" required>
                    </div>

                    <div class="field full-width">
                        <label>Upload Images</label>
                        <input type="file" name="imageFiles" accept="image/*" multiple>
                        <small class="help-text">Maximum 5 images, total combined size up to 100 MB.</small>
                    </div>
                </div>
                <input type="hidden" name="formToken" th:value="${formToken}">
                <div class="form-actions">
                    <button type="submit" class="btn" id="saveBtn">Save Event</button>
                    <button type="reset" class="btn secondary-btn">Reset Form</button>
                </div>
            </form>
        </div>
    </div>
<script>
    const eventForm = document.getElementById('eventForm');
    const saveBtn = document.getElementById('saveBtn');

    if (eventForm && saveBtn) {
        eventForm.addEventListener('submit', function () {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
        });
    }
</script>
   
</body>

</html>
